<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre Chat Privé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            min-width: 300px;
        }

        .container h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .container h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        #chatPage {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            height: 100vh;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 20px;
            color: white;
            margin: 0;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #e5ddd5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: #dcf8c6;
            border-bottom-right-radius: 0;
        }

        .message.received .message-bubble {
            background: white;
            border-bottom-left-radius: 0;
        }

        .message-sender {
            font-weight: bold;
            font-size: 12px;
            color: #667eea;
            margin-bottom: 3px;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }

        .input-container {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 10px;
        }

        .input-container input[type="text"] {
            flex: 1;
            margin: 0;
        }

        .btn-attach, .btn-send {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-attach {
            background: #34b7f1;
            color: white;
        }

        .btn-send {
            background: #075e54;
            color: white;
        }

        .btn-attach:hover, .btn-send:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- الخطوة 1: إدخال الرقم وكلمة السر -->
    <div id="step1Page" class="page">
        <div class="container">
            <h1>🔐 تسجيل الدخول</h1>
            <input type="text" id="phoneNumber" placeholder="أدخل رقمك">
            <input type="password" id="password" placeholder="أدخل كلمة السر">
            <div id="error1" class="error-message hidden"></div>
            <button onclick="checkStep1()" class="btn-primary">التالي</button>
        </div>
    </div>

    <!-- الخطوة 2: سؤال الأمان -->
    <div id="step2Page" class="page hidden">
        <div class="container">
            <h2>🔒 سؤال الأمان</h2>
            <p style="margin-bottom: 20px; color: #666;">ما اسم أم زوجتك وزوجك؟</p>
            <input type="text" id="securityAnswer" placeholder="أدخل الإجابة">
            <div id="error2" class="error-message hidden"></div>
            <button onclick="checkStep2()" class="btn-primary">دخول</button>
        </div>
    </div>

    <!-- صفحة المحادثة -->
    <div id="chatPage" class="page hidden">
        <div class="header">
            <h2 id="chatTitle">💑 Notre Conversation</h2>
            <button onclick="logout()" class="btn-logout">Déconnexion</button>
        </div>
        
        <div id="messages" class="messages-container"></div>
        
        <div class="input-container">
            <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="sendFile()">
            <button onclick="document.getElementById('fileInput').click()" class="btn-attach">📎</button>
            <input type="text" id="messageInput" placeholder="Écrivez un message..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" class="btn-send">➤</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB4vxC_E77us7W8ZResF-QztxsYtd_jIXw",
            authDomain: "caller-n8fa5t.firebaseapp.com",
            databaseURL: "https://caller-n8fa5t-default-rtdb.firebaseio.com",
            projectId: "caller-n8fa5t",
            storageBucket: "caller-n8fa5t.firebasestorage.app",
            messagingSenderId: "555965049878",
            appId: "1:555965049878:web:6e64d012a64e02c1bc1937",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        let currentUser = null;

        // بيانات المستخدمين المصرح لهم
        const authorizedUsers = {
            "0123456789": "password123",  // غير هذا برقمك وكلمة السر الحقيقية
            "0987654321": "password456"   // رقم الزوجة وكلمة السر
        };

        const correctAnswer = "سعاد و نبيلة";

        function checkStep1() {
            const phone = document.getElementById('phoneNumber').value.trim();
            const password = document.getElementById('password').value;
            const error1 = document.getElementById('error1');

            if (!phone || !password) {
                error1.textContent = "الرجاء إدخال الرقم وكلمة السر";
                error1.classList.remove('hidden');
                return;
            }

            if (authorizedUsers[phone] && authorizedUsers[phone] === password) {
                currentUser = phone;
                error1.classList.add('hidden');
                document.getElementById('step1Page').classList.add('hidden');
                document.getElementById('step2Page').classList.remove('hidden');
            } else {
                error1.textContent = "رقم أو كلمة سر غير صحيحة";
                error1.classList.remove('hidden');
            }
        }

        function checkStep2() {
            const answer = document.getElementById('securityAnswer').value.trim();
            const error2 = document.getElementById('error2');

            if (answer === correctAnswer) {
                error2.classList.add('hidden');
                document.getElementById('step2Page').classList.add('hidden');
                document.getElementById('chatPage').classList.remove('hidden');
                loadMessages();
            } else {
                error2.textContent = "إجابة خاطئة! سيتم إغلاق التطبيق";
                error2.classList.remove('hidden');
                
                setTimeout(() => {
                    window.close();
                    window.location.href = 'about:blank';
                }, 2000);
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('chatPage').classList.add('hidden');
            document.getElementById('step1Page').classList.remove('hidden');
            document.getElementById('phoneNumber').value = '';
            document.getElementById('password').value = '';
            document.getElementById('securityAnswer').value = '';
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();
            
            if (text && currentUser) {
                database.ref('messages').push({
                    text: text,
                    sender: currentUser,
                    timestamp: Date.now(),
                    type: 'text'
                });
                messageInput.value = '';
            }
        }

        function sendFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (file && currentUser) {
                const storageRef = storage.ref('files/' + Date.now() + '_' + file.name);
                const uploadTask = storageRef.put(file);
                
                uploadTask.on('state_changed',
                    (snapshot) => {},
                    (error) => {
                        alert('Erreur lors du téléchargement du fichier');
                    },
                    () => {
                        uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                            database.ref('messages').push({
                                fileURL: downloadURL,
                                fileType: file.type.startsWith('image') ? 'image' : 'video',
                                sender: currentUser,
                                timestamp: Date.now(),
                                type: 'file'
                            });
                        });
                    }
                );
                fileInput.value = '';
            }
        }

        function loadMessages() {
            const messagesRef = database.ref('messages');
            messagesRef.on('child_added', (snapshot) => {
                const message = snapshot.val();
                displayMessage(message);
            });
        }

        function displayMessage(message) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            const isSent = message.sender === currentUser;
            
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            if (!isSent) {
                const senderName = document.createElement('div');
                senderName.className = 'message-sender';
                senderName.textContent = message.sender;
                bubble.appendChild(senderName);
            }
            
            if (message.type === 'text') {
                const textContent = document.createElement('div');
                textContent.textContent = message.text;
                bubble.appendChild(textContent);
            } else if (message.type === 'file') {
                if (message.fileType === 'image') {
                    const img = document.createElement('img');
                    img.src = message.fileURL;
                    bubble.appendChild(img);
                } else if (message.fileType === 'video') {
                    const video = document.createElement('video');
                    video.src = message.fileURL;
                    video.controls = true;
                    bubble.appendChild(video);
                }
            }
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date(message.timestamp).toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            bubble.appendChild(time);
            
            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
